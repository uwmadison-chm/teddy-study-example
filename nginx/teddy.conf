# An nginx site for Teddy, serving the build that deploy.sh copies to
# /var/www/teddy/. Teddy needs HTTPS: browsers only allow the camera on a
# secure page.

server {
    listen 443 ssl;
    server_name teddy.example.edu;

    ssl_certificate     /etc/ssl/certs/teddy.example.edu.pem;
    ssl_certificate_key /etc/ssl/private/teddy.example.edu.key;

    root /var/www/teddy;
    index index.html;

    # The build has a .gz copy of each file that compresses well; send it to
    # browsers that accept gzip. Vary keeps caches from mixing the two up.
    gzip_static on;
    gzip_vary on;

    # index.html isn't hashed, so browsers have to check for a new one.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything in assets/ has a hash of its contents in its name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
